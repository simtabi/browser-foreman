name: Bug report
description: Something does not work as the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Security problems go to SECURITY.md, never here. Leave bookmarks, tab titles and addresses out of what you paste.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `browser-foreman version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and browsers
      placeholder: macOS 15.4, Chrome 140, Safari 19
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. browser-foreman serve\n2. …"
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      render: text
