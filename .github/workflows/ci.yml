name: CI

# Pull requests, by hand, and once a week against main (the post-merge check). Never on a branch push.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review] # ready_for_review: a draft made ready gets its run
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }} # a manual run never cancels the weekly one, or the other way
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOPRIVATE: github.com/simtabi/*
  GONOSUMDB: github.com/simtabi/*

jobs:
  go:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The postgres driver's tests: the same disposable Postgres as `make testdb-up` (test/postgres/compose.yaml).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: brofo
          POSTGRES_DB: brofo_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U brofo -d brofo_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      BROFO_TEST_POSTGRES_DSN: postgres://brofo@127.0.0.1:55433/brofo_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - run: make fmt vet tidy vuln test
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: src
      - run: make build
  web:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cd web && npm install --no-audit --no-fund && npm run check:web && npm run test:web && npm run build:extension
