version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/src"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "America/New_York"}
    open-pull-requests-limit: 5
    groups:
      gomod-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "America/New_York"}
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "America/New_York"}
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
